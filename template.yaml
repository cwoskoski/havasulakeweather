AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Havasu Lake Weather — ingest (Phase 2: storage).
  Ambient console --HTTP:80--> CloudFront --HTTPS--> Lambda (Node 24) --> DynamoDB.

Parameters:
  AllowedStationKeys:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Comma-separated station PASSKEYs allowed to store data. Empty = accept all
      (passed at deploy via --parameter-overrides so the key isn't committed).

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 128
    Architectures:
      - arm64

Resources:
  # Single table. On-demand billing; storage is free under 25 GB (~50 years here).
  # Time-series items:  pk = OBS#<stationKey>#YYYY-MM, sk = <dateutc ISO>
  # Latest pointer:     pk = STATION#<stationKey>,     sk = LATEST
  WeatherTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: havasu-weather
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: havasu-weather-ingest
      Description: Receives Ambient console posts; stores outdoor readings in DynamoDB
      CodeUri: ingest/
      Handler: src/handler.handler
      FunctionUrlConfig:
        AuthType: NONE # Phase 2; lock to CloudFront (OAC/IAM) in the hardening pass.
      LoggingConfig:
        LogFormat: JSON
      Environment:
        Variables:
          TABLE_NAME: !Ref WeatherTable
          ALLOWED_STATION_KEYS: !Ref AllowedStationKeys
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WeatherTable

  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${IngestFunction}"
      RetentionInDays: 14

  # Read API (JSON for the public page). Separate function, read-only on the table.
  ReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: havasu-weather-read
      Description: Read API — current conditions + history JSON
      CodeUri: ingest/
      Handler: src/read.handler
      FunctionUrlConfig:
        AuthType: NONE
      LoggingConfig:
        LogFormat: JSON
      Environment:
        Variables:
          TABLE_NAME: !Ref WeatherTable
          STATION_KEY: !Ref AllowedStationKeys
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref WeatherTable

  ReadLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ReadFunction}"
      RetentionInDays: 14

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Havasu weather ingest — accepts the console's plaintext HTTP
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: LambdaOrigin
            DomainName: !Select [2, !Split ["/", !GetAtt IngestFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: LambdaOrigin
          ViewerProtocolPolicy: allow-all
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

Outputs:
  IngestUrl:
    Description: Point the weather console's Customized upload here (HTTP, port 80)
    Value: !Sub "http://${Distribution.DomainName}/"
  CloudFrontDomain:
    Value: !GetAtt Distribution.DomainName
  FunctionUrl:
    Value: !GetAtt IngestFunctionUrl.FunctionUrl
  WeatherTableName:
    Value: !Ref WeatherTable
  ReadApiUrl:
    Description: Read API base (append /api/current or /api/history?hours=24)
    Value: !GetAtt ReadFunctionUrl.FunctionUrl
